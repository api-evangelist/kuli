aid: kuli
name: Kuli
description: Kuli is an AI agent for influencer marketing, built for consumer brands. It runs the full creator
  marketing lifecycle end to end — discovery, vetting, outreach, and reporting — so a small marketing team ships
  like a much larger one. Unlike platforms that filter creators on metadata such as follower counts and engagement
  rates, Kuli's agent watches actual creator videos frame by frame across TikTok and Instagram, assessing brand
  safety, content style, audience signals, and brand fit, then drafts personalized outreach in the brand's own
  voice and reports campaign ROI on a schedule. Founded in 2025 and headquartered in Levallois-Perret, Paris,
  Kuli is a Y Combinator company. As of this profile Kuli publishes no public API, developer portal, or SDKs —
  its only machine-readable surface is an llms.txt.
