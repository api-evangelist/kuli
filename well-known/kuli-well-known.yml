generated: '2026-08-13'
method: probed
source: live probes of kuli.one, app.kuli.one, discovery.kuli.one and the Kuli Discovery backend host
note: >-
  Probed the standard /.well-known/ discovery surface on every Kuli host reachable
  from public material. kuli.one is a Framer-hosted single-page site that answers
  HTTP 200 with its 17,113-byte homepage document for every unmatched path, so raw
  status codes there are not meaningful — every kuli.one probe below is a soft 404,
  confirmed against a control request for a nonsense path that returned the identical
  body. discovery.kuli.one behaves the same way with its own 3,737-byte SPA shell.
  The one host that answers honestly is the Kuli Discovery backend (uvicorn/FastAPI),
  which returns a real JSON 404 for every /.well-known/ path. No /.well-known/
  document is published anywhere. No WellKnown and no SecurityTxt pointer is emitted,
  because nothing real was found — this file records a verified absence, not a presence.
hosts:
- host: https://kuli.one
  soft_404: true
  soft_404_evidence: >-
    Control request to /definitely-not-real-zzz999 returned HTTP 200 with the same
    17,113-byte homepage HTML body (text/html) as every probe below.
  documents:
  - {path: /.well-known/security.txt, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/openid-configuration, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/oauth-authorization-server, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/oauth-protected-resource, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/api-catalog, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/ai-plugin.json, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/agent-card.json, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/agent.json, status: 200, result: soft-404, content_type: text/html}
- host: https://app.kuli.one
  note: >-
    The product application. Cloudflare answers with a bot-challenge interstitial
    (HTTP 403, "Just a moment...") for application paths. Every /.well-known/ path
    301-redirects to https://discovery.kuli.one — a catch-all redirect, not a document.
  documents:
  - {path: /.well-known/agent-card.json, status: 301, result: redirect-to-discovery, location: https://discovery.kuli.one}
  - {path: /.well-known/agent.json, status: 301, result: redirect-to-discovery, location: https://discovery.kuli.one}
  - {path: /.well-known/security.txt, status: 301, result: redirect-to-discovery, location: https://discovery.kuli.one}
  - {path: /.well-known/oauth-authorization-server, status: 301, result: redirect-to-discovery, location: https://discovery.kuli.one}
- host: https://discovery.kuli.one
  soft_404: true
  soft_404_evidence: >-
    Every /.well-known/ path returns HTTP 200 with the identical 3,737-byte React SPA
    shell (title "Kuli Discovery", root div, module script tags) — a client-side
    catch-all, not a document.
  documents:
  - {path: /.well-known/agent-card.json, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/agent.json, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/security.txt, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/api-catalog, status: 200, result: soft-404, content_type: text/html}
  - {path: /.well-known/oauth-authorization-server, status: 200, result: soft-404, content_type: text/html}
  - {path: /llms.txt, status: 200, result: soft-404, content_type: text/html}
- host: https://kuli-discovery-backend-prod.livelyocean-00d2887a.westeurope.azurecontainerapps.io
  note: >-
    The application backend behind discovery.kuli.one (server header "uvicorn";
    FastAPI-shaped {"detail":"Not Found"} bodies). Honest 404s — no SPA catch-all.
  documents:
  - {path: /.well-known/agent-card.json, status: 404, result: not-found, content_type: application/json}
  - {path: /.well-known/agent.json, status: 404, result: not-found, content_type: application/json}
  - {path: /.well-known/security.txt, status: 404, result: not-found, content_type: application/json}
